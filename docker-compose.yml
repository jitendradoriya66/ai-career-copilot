version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: copilot_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./career_copilot.db
      - JWT_SECRET_KEY=production-secret-key-2026
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
